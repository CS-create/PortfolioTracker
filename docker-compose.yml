services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfoliotracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "5130:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=portfoliotracker;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "PortfolioTracker"
      Jwt__Audience: "PortfolioTrackerUsers"
      Jwt__ExpiryMinutes: "60"
      StockPrice__ApiKey: ${ALPHA_VANTAGE_API_KEY}
      StockPrice__BaseUrl: "https://www.alphavantage.co"
      StockPrice__CacheMinutes: "15"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
    ports:
      - "5171:8080"
    environment:
      ApiBaseUrl: "http://api:8080/api/"
    depends_on:
      - api

volumes:
  postgres-data:
